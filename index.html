:root{
  --bg:#f7f9ee; --surface:#fdfef9; --fg:#1f2a16; --muted:#475339;
  --line:#d5deba; --edge:#7d8f55;
  --primary:#3f5a14; --primary-ink:#ffffff; --primary-soft:#e9f0cf;
  --band:#e8efcf;
  --ok:#1a5424; --ok-soft:#dff0d3; --bad:#8f1d16; --bad-soft:#fbe9e6;
  --warn:#5e4300; --warn-soft:#fbf3d9; --stage:#f1f5e3;
  --scale:1;
  --font:'Open Sans',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
html{font-size:calc(112.5% * var(--scale));-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-bottom:140px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gov{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.gov .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--primary);min-width:0}
.brand i{flex:none;display:block;width:4px;height:28px;background:var(--primary)}
.zoom{display:flex;gap:8px;flex:none}
.zoom button{font:700 1rem var(--font);min-width:48px;min-height:48px;border:2px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:8px;cursor:pointer}
.zoom button[disabled]{opacity:.4}
.band{background:var(--band);border-bottom:1px solid var(--line)}
.band .wrap{padding-block:16px}
.band h1{margin:0;font-size:1.3rem;line-height:1.3;font-weight:700;text-wrap:balance}
.band p{margin:2px 0 0;color:var(--muted)}
main.wrap{padding-block:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 18px;min-width:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.top b{font-weight:700}
.stats{color:var(--muted)}
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--primary)}
.tag{display:block;font-size:.9rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);margin-bottom:6px}
h2{margin:0;font-size:1.35rem;line-height:1.45;font-weight:600;text-wrap:pretty}
.sign{margin:16px 0 4px;background:var(--stage);border:1px solid var(--line);border-radius:8px;display:flex;justify-content:center;padding:14px}
.sign svg{width:160px;height:160px;max-width:100%}
.opts{display:grid;gap:12px;margin:20px 0 4px;border:0;padding:0;min-width:0}
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px;min-height:64px;border:2px solid var(--edge);border-radius:10px;cursor:pointer;background:var(--surface);position:relative;font-size:1.15rem;line-height:1.45}
.opt input{position:absolute;opacity:0;pointer-events:none}
.ltr{flex:none;width:36px;height:36px;border:2px solid var(--primary);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1rem;color:var(--primary)}
.txt{min-width:0;padding-top:4px;overflow-wrap:anywhere}
.mark{display:block;font-size:1rem;font-weight:700;margin-top:4px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.opt.sel .ltr{background:var(--primary);color:var(--primary-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ok .mark{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.bad .mark{color:var(--bad)}
.opt.locked{cursor:default}
.opt:focus-within,.btn:focus-visible,.zoom button:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.fb{margin-top:20px;border-left:6px solid var(--primary);background:var(--primary-soft);padding:14px 16px;border-radius:0 8px 8px 0}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb strong{display:block;margin-bottom:4px;font-size:1.1rem}
.ref{display:block;margin-top:8px;font-size:.9rem;color:var(--muted)}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.btn{font:700 1.2rem var(--font);min-height:58px;padding:12px 24px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);cursor:pointer;width:100%}
.btn.sec{background:var(--surface);color:var(--primary)}
.btn[disabled]{background:#d9e0c4;border-color:#d9e0c4;color:#4f5a40;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--edge);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto}
.end h2{margin-bottom:8px}
.score{font-size:2.6rem;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}
.stack{display:grid;gap:12px;margin-top:20px}
.lead{color:var(--muted);margin:0}
.foot{padding-block:8px 24px;color:var(--muted);font-size:.9rem}
.foot p{margin:0 0 10px}
.linkbtn{font:600 1rem var(--font);color:var(--primary);background:none;border:0;padding:10px 0;min-height:44px;text-decoration:underline;cursor:pointer}
.confirm{background:var(--warn-soft);color:var(--warn);border:2px solid var(--warn);border-radius:10px;padding:14px;margin:8px 0}
.confirm p{margin:0 0 12px;font-size:1rem;color:var(--warn)}
.confirm .row{display:grid;gap:10px}
.notice{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.95rem}
@media (min-width:600px){.confirm .row,.stack{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s ease}}
</style>
</head>

/* [categoria, pergunta, resposta correta, errada, errada, errada, explicação, página do guia, placa opcional] */
var RAW=[
/* ---- Carteira e permissões ---- */
["L","Qual é a idade mínima para obter uma carteira de classe 5 (veículo de passeio) em Québec?","16 anos","15 anos","17 anos","18 anos","O candidato deve ter pelo menos 16 anos. Se tiver menos de 18, precisa do consentimento por escrito de quem detém a autoridade parental.",15],
["L","Uma pessoa de 16 anos quer obter a carteira de classe 5. Que exigência adicional ela deve cumprir?","Apresentar o consentimento por escrito de quem detém a autoridade parental","Apresentar uma autorização da escola","Ter um seguro em seu nome","Esperar até completar 17 anos","Quem tem menos de 18 anos precisa do consentimento por escrito de quem detém a autoridade parental.",15],
["L","Há quanto tempo, no mínimo, o aprendiz deve ter a permissão de aprendiz para poder fazer a prova prática?","12 meses","6 meses","10 meses","24 meses","Para ser admitido na prova prática, é preciso ter a permissão de aprendiz há pelo menos 12 meses.",19],
["L","Quando um aprendiz pode fazer a prova teórica na SAAQ?","Com a permissão de aprendiz há pelo menos 10 meses e um agendamento","Assim que recebe a permissão de aprendiz","Com a permissão há pelo menos 12 meses","Ao completar 18 anos","Para ser admitido na prova teórica, é preciso ter a permissão de aprendiz há pelo menos 10 meses e ter agendado a prova.",18],
["L","Em que horário o titular de uma permissão de aprendiz é proibido de dirigir?","Entre meia-noite e 5h","Entre 22h e 6h","Entre 23h e 5h","Entre meia-noite e 6h","A permissão de aprendiz proíbe dirigir entre meia-noite e 5h da manhã.",17],
["L","Que requisitos deve cumprir quem acompanha um aprendiz fora do curso de direção?","Ter carteira válida para veículo de passeio há pelo menos 2 anos e sentar-se ao lado dele","Ter carteira há 1 ano e sentar-se no banco de trás","Ter permissão probatória e sentar-se ao lado dele","Ter 21 anos ou mais, independentemente do tempo de carteira","O acompanhante deve ter carteira válida há pelo menos dois anos, sentar-se ao lado do aprendiz e poder dar-lhe ajuda e conselhos.",18],
["L","O titular de uma permissão probatória pode acompanhar um aprendiz?","Não, é proibido","Sim, se tiver mais de 12 meses de experiência","Sim, se tiver mais de 25 anos","Sim, mas somente de dia","O titular de uma permissão probatória não pode acompanhar um aprendiz em seu aprendizado.",18],
["L","Por quanto tempo a permissão probatória deve estar válida antes de se obter a carteira de motorista?","24 meses","12 meses","18 meses","36 meses","São necessários 24 meses de permissão probatória válida. A experiência só é contada enquanto a permissão está válida.",19],
["L","Um titular de permissão probatória acumula 4 pontos de inaptidão. O que acontece?","A permissão é revogada e ele não pode obter outra por pelo menos 3 meses","Recebe uma advertência por escrito","A permissão é suspensa por 24 horas","Paga uma multa e mantém a permissão","Com 4 pontos ou mais, a permissão de aprendiz ou probatória é revogada e não se pode obter uma nova antes de 3 meses.",20],
["L","Quantos pontos de inaptidão levam à revogação da carteira de um motorista com 25 anos ou mais?","15 pontos","8 pontos","12 pontos","10 pontos","O regime é de 15 pontos para titulares com 25 anos ou mais.",21],
["L","Quantos pontos levam à revogação da carteira de um motorista com menos de 23 anos?","8 pontos","4 pontos","12 pontos","15 pontos","Menos de 23 anos: 8 pontos. De 23 a 24 anos: 12 pontos. Com 25 anos ou mais: 15 pontos.",21],
["L","Quantas classes de carteira existem em Québec?","12","5","8","15","Existem 12 classes, e cada uma autoriza a condução de uma categoria de veículos.",22],
["L","Que veículos a carteira de classe 5 autoriza a dirigir?","Automóveis, vans e caminhões de 2 eixos com massa líquida inferior a 4 500 kg","Somente automóveis de passageiros","Caminhões com mais de 4 500 kg","Motocicletas e ciclomotores","A classe 5 cobre veículos de passeio (automóvel ou van) e caminhões de 2 eixos com menos de 4 500 kg, entre outros.",29],
["L","Se alguém dirige sem uma carteira da classe apropriada, o que um agente da paz pode fazer com o veículo?","Apreendê-lo por 30 dias","Apreendê-lo por 7 dias","Retê-lo por 24 horas","Nada, só pode multar","O agente pode apreender o veículo por um período de 30 dias.",38],
["L","Que documentos o motorista deve levar sempre consigo?","Carteira válida e assinada, certificado de registro do veículo e comprovante de seguro","Somente a carteira de motorista","Carteira e passaporte","Carteira e cartão do seguro-saúde","É preciso portar a carteira válida e assinada, o certificado de registro válido e assinado e o comprovante de seguro ou de solvência.",38],
["L","Em quanto tempo é preciso informar à SAAQ uma mudança de endereço?","30 dias","7 dias","15 dias","60 dias","Todo motorista deve informar a mudança de endereço em até 30 dias.",39],
["L","A carteira plástica com foto dura quatro anos. Com que frequência é preciso pagar para manter o direito de dirigir?","Todo ano","A cada 4 anos","A cada 2 anos","A cada 6 meses","Embora a carteira dure quatro anos, o privilégio de dirigir só é válido por um ano e deve ser pago anualmente.",40],
["L","Uma pessoa com carteira válida de outra província se muda para Québec. Até quando ela pode dirigir um veículo de passeio sem carteira de Québec?","Por 6 meses a partir da data em que se estabeleceu","Por 30 dias","Por 3 meses","Por 1 ano","Ela pode dirigir um veículo de passeio durante os seis meses seguintes ao seu estabelecimento.",41],
["L","Se o estado de saúde mudar e puder afetar a direção, em quanto tempo é preciso informar a SAAQ?","30 dias","24 horas","7 dias","Somente ao renovar a carteira","Toda mudança no estado de saúde deve ser comunicada em até 30 dias.",35],
["L","O que significa a condição A em uma carteira de motorista?","É obrigatório usar óculos ou lentes de contato para dirigir","Só pode dirigir de dia","É obrigatório usar aparelho auditivo","Só pode dirigir veículo automático","A condição A obriga o uso de lentes corretivas. A B é dirigir somente de dia e a J, câmbio automático.",36],
["L","Um motorista com a carteira suspensa por uma multa não paga dirige mesmo assim. O que pode acontecer?","Apreensão do veículo por 30 dias e multa de 300 $ a 600 $","Somente uma advertência","Uma multa de 15 $","Revogação imediata e prisão","O agente pode apreender o veículo por 30 dias e aplicar multa de 300 $ a 600 $, além das custas judiciais.",45],
["L","Por quanto tempo os pontos de inaptidão permanecem no registro?","2 anos a partir da declaração de culpa ou do pagamento da multa","1 ano","5 anos","Até a renovação da carteira","Permanecem 2 anos a partir da declaração de culpa. Pagar a multa equivale a essa declaração.",49],
["L","Quando os pontos de inaptidão são lançados no registro de condução?","Quando a SAAQ recebe o aviso de sentença que confirma a culpa","No dia da infração","No dia em que o policial entrega a multa","No dia da renovação anual","São lançados ao receber o aviso de sentença, não na data da infração.",47],
["L","A quem se pede uma permissão restrita depois de uma primeira revogação por pontos?","A um juiz da Cour du Québec","A qualquer agente de polícia","À seguradora","À prefeitura","É preciso apresentar um pedido a um juiz da Cour du Québec e provar que dirigir é necessário para o trabalho principal.",50],
["L","Um motorista de 30 anos perde a carteira por acúmulo de pontos pela primeira vez em dois anos. Quanto dura a sanção?","3 meses","6 meses","12 meses","1 mês","Primeira vez: 3 meses. Segunda: 6 meses. Terceira: 12 meses.",49],
["L","A partir de que idade a SAAQ pode exigir um exame de competência ou uma avaliação de saúde?","70 anos","60 anos","65 anos","75 anos","A Société pode exigir isso quando o titular chega aos 70 anos.",37],
["L","O que deve fazer uma pessoa cuja carteira está vencida há 3 anos ou mais?","Passar novamente nas provas teórica e prática","Apenas pagar a renovação","Fazer somente a prova teórica","Fazer somente a prova prática","Se a permissão está vencida há três anos ou mais, é preciso passar nas provas teórica e prática.",40],
["L","É legal ser titular de duas carteiras de motorista emitidas por administrações diferentes?","Não, é proibido ter mais de uma","Sim, se uma for de Québec e a outra dos EUA","Sim, se ambas estiverem válidas","Sim, com autorização da SAAQ","É proibido ser titular de mais de uma carteira emitida pela SAAQ ou por outra administração do Canadá ou dos EUA.",39],
["L","Qual é a idade mínima para dirigir um ciclomotor (classe 6D)?","14 anos","12 anos","16 anos","18 anos","É preciso ter 14 anos ou mais (com consentimento dos pais se for menor), passar no curso e nas provas.",33],
/* ---- Álcool, drogas e distrações ---- */
["A","A partir de que alcoolemia um motorista pode ser acusado segundo o Código Criminal?","80 mg por 100 ml de sangue (0,08)","50 mg por 100 ml (0,05)","100 mg por 100 ml (0,10)","120 mg por 100 ml (0,12)","Com 80 mg de álcool por 100 ml de sangue ou mais, é possível ser acusado com base no Código Criminal.",53],
["A","O que ocorre com uma alcoolemia de 0,05 em um adulto médio?","As faculdades já ficam significativamente afetadas","Não há nenhum efeito perceptível","Só os motoristas jovens são afetados","Aumenta a confiança sem afetar a direção","Já com 0,05 as faculdades ficam muito afetadas, mesmo sem ultrapassar o limite legal.",66],
["A","Com uma alcoolemia entre 0,05 e 0,08, quantas vezes aumenta o risco de acidente?","4,5 vezes","1,5 vez","2 vezes","Não aumenta","Essa faixa de alcoolemia multiplica por 4,5 o risco de se envolver em um acidente.",66],

var BANK=RAW.map(function(r,i){return {id:i,c:r[0],q:r[1],o:[r[2],r[3],r[4],r[5]],e:r[6],p:r[7],s:r[8]||null};});
var N=BANK.length;

/* ---------- utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ids(){var a=[];for(var i=0;i<N;i++)a.push(i);return a;}
var LET=['A','B','C','D'];

/* ---------- progresso salvo no navegador (localStorage) ---------- */
var canStore=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist();}}catch(e){}

function fresh(scale){return {v:1,mode:'all',order:shuffle(ids()),i:0,perm:null,pick:null,done:false,res:{},scale:scale||1};}
function load(){
  var raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!raw||!Array.isArray(raw.order))return fresh();
  var seen={},order=[];
  raw.order.forEach(function(x){if(Number.isInteger(x)&&x>=0&&x<N&&!seen[x]){seen[x]=1;order.push(x);}});
  if(!order.length)return fresh(raw.scale);
  var mode=raw.mode==='errors'?'errors':'all';
  if(mode==='all'){ /* perguntas novas, se o banco crescer, entram no fim da fila */
    var missing=ids().filter(function(x){return !seen[x];});
    order=order.concat(shuffle(missing));
  }
  var P={v:1,mode:mode,order:order,i:Math.min(Math.max(parseInt(raw.i,10)||0,0),order.length),perm:null,pick:null,done:false,res:{},scale:SCALES.indexOf(raw.scale)>-1?raw.scale:1};
  if(raw.res&&typeof raw.res==='object'){Object.keys(raw.res).forEach(function(k){if(raw.res[k]===0||raw.res[k]===1)P.res[k]=raw.res[k];});}
  if(Array.isArray(raw.perm)&&raw.perm.length===4&&[0,1,2,3].every(function(n){return raw.perm.indexOf(n)>-1;}))P.perm=raw.perm;
  if(P.perm&&Number.isInteger(raw.pick)&&raw.pick>=0&&raw.pick<4)P.pick=raw.pick;
  P.done=!!(raw.done&&P.perm&&P.pick!==null);
  return P;
}
var P=load();
function save(){if(!canStore)return;try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
var confirmReset=false;

function applyScale(){
  document.documentElement.style.setProperty('--scale',String(P.scale));
  var k=SCALES.indexOf(P.scale);
  document.getElementById('z-dn').disabled=(k<=0);
  document.getElementById('z-up').disabled=(k>=SCALES.length-1);
}

function stats(){
  var ans=0,ok=0;
  P.order.forEach(function(id){if(P.res[id]===0||P.res[id]===1){ans++;if(P.res[id]===1)ok++;}});
  return {ans:ans,ok:ok};
}

/* ---------- telas ---------- */
var $app=document.getElementById('app'),$bar=document.getElementById('bar'),$barIn=document.getElementById('bar-in'),$foot=document.getElementById('foot');

function render(){
  applyScale();
  var finished=P.i>=P.order.length;
  if(finished)renderEnd();else renderQuiz();
  renderFoot();
}

function renderQuiz(){
  var total=P.order.length;
  var b=BANK[P.order[P.i]];
  if(!P.perm){P.perm=shuffle([0,1,2,3]);P.pick=null;P.done=false;save();}
  var st=stats();
  var last=P.i===total-1;
  var html='<section class="card" aria-live="off">'+
    (canStore?'':'<div class="notice" role="note">Este navegador não permite salvar o progresso (modo privado?). Ao fechar a página, você volta ao início.</div>')+
    '<div class="top"><span>Pergunta <b>'+(P.i+1)+'</b> de '+total+'</span>'+(st.ans?'<span class="stats">Acertos: <b>'+st.ok+'</b> de '+st.ans+'</span>':'')+'</div>'+
    '<div class="prog" aria-hidden="true"><i style="width:'+(P.i/total*100)+'%"></i></div>'+
    '<span class="tag">'+esc(CATS[b.c])+(P.mode==='errors'?' · revisão de erros':'')+'</span><h2 id="qtext">'+esc(b.q)+'</h2>'+
    (b.s?'<div class="sign">'+SIGNS[b.s]+'</div>':'')+
    '<fieldset class="opts" aria-labelledby="qtext">';
  for(var k=0;k<4;k++){
    var ok=P.perm[k]===0;
    var cls='opt',mark='';
    if(P.done){cls+=' locked';if(ok){cls+=' ok';mark='<span class="mark">✓ Resposta correta</span>';}else if(P.pick===k){cls+=' bad';mark='<span class="mark">✗ Sua resposta</span>';}}
    else if(P.pick===k)cls+=' sel';
    html+='<label class="'+cls+'" for="o'+k+'"><input type="radio" name="ans" id="o'+k+'" value="'+k+'"'+(P.pick===k?' checked':'')+(P.done?' disabled':'')+'><span class="ltr" aria-hidden="true">'+LET[k]+'</span><span class="txt">'+esc(b.o[P.perm[k]])+mark+'</span></label>';
  }
  html+='</fieldset>';
  if(P.done){
    var right=P.perm[P.pick]===0;
    html+='<div class="fb '+(right?'ok':'bad')+'" role="status"><strong>'+(right?'✓ Resposta correta':'✗ Resposta incorreta')+'</strong>'+esc(b.e)+'<span class="ref">Guide de la route, p. '+b.p+'</span></div>';
  }
  html+='</section>';
  $app.innerHTML=html;
  $bar.hidden=false;
  $barIn.innerHTML=P.done
    ?'<button class="btn" id="main-btn" data-act="next">'+(last?'Ver resultado':'Próxima pergunta')+'</button>'
    :'<button class="btn" id="main-btn" data-act="check"'+(P.pick===null?' disabled':'')+'>Validar a resposta</button>';
}

function renderEnd(){
  var st=stats();
  var wrong=P.order.filter(function(id){return P.res[id]===0;});
  var pct=st.ans?Math.round(st.ok/st.ans*100):0;
  $bar.hidden=true;
  $app.innerHTML='<section class="card end"><span class="tag">'+(P.mode==='errors'?'Revisão de erros concluída':'Todas as perguntas concluídas')+'</span>'+
    '<h2>Você chegou ao fim.</h2><div class="score">'+st.ok+' / '+st.ans+'</div><p class="lead">'+pct+' % de respostas corretas.</p>'+
    '<div class="stack">'+
    (wrong.length?'<button class="btn" data-act="errors">Repassar só os erros ('+wrong.length+')</button>':'')+
    '<button class="btn'+(wrong.length?' sec':'')+'" data-act="restart-now">Recomeçar tudo</button></div></section>';
  window.scrollTo(0,0);
}

function renderFoot(){
  var html='';
  if(confirmReset){
    html+='<div class="confirm" role="alert"><p>Apagar o progresso e recomeçar do início?</p><div class="row"><button class="btn sec" data-act="reset-no">Cancelar</button><button class="btn" data-act="restart-now">Sim, recomeçar</button></div></div>';
  }else if(P.i<P.order.length){
    html+='<button class="linkbtn" data-act="reset-ask">Recomeçar do início</button>';
  }
  html+='<p>Perguntas baseadas no Guide de la route, 4.ª edição (SAAQ, 2024). Material de prática não oficial. O progresso fica salvo neste aparelho.</p>';
  $foot.innerHTML=html;
}

/* ---------- ações ---------- */
function selectOption(k){
  if(P.done||P.i>=P.order.length)return;
  P.pick=k;save();
  Array.prototype.forEach.call($app.querySelectorAll('.opt'),function(l,j){l.classList.toggle('sel',j===k);l.querySelector('input').checked=(j===k);});
  var b=document.getElementById('main-btn');if(b)b.disabled=false;
}
function act(a){
  if(a==='check'){
    if(P.pick===null||P.done)return;
    P.done=true;P.res[P.order[P.i]]=(P.perm[P.pick]===0)?1:0;save();render();
    var fb=$app.querySelector('.fb');if(fb)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  else if(a==='next'){
    if(!P.done)return;
    P.i++;P.perm=null;P.pick=null;P.done=false;save();render();window.scrollTo(0,0);
  }
  else if(a==='reset-ask'){confirmReset=true;renderFoot();}
  else if(a==='reset-no'){confirmReset=false;renderFoot();}
  else if(a==='restart-now'){var sc=P.scale;P=fresh(sc);confirmReset=false;save();render();window.scrollTo(0,0);}
  else if(a==='errors'){
    var wrong=P.order.filter(function(id){return P.res[id]===0;});
    if(!wrong.length)return;
    wrong.forEach(function(id){delete P.res[id];});
    P.mode='errors';P.order=shuffle(wrong);P.i=0;P.perm=null;P.pick=null;P.done=false;save();render();window.scrollTo(0,0);
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');
  if(b&&!b.disabled)act(b.getAttribute('data-act'));
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.name==='ans')selectOption(parseInt(e.target.value,10));
});
document.getElementById('z-up').addEventListener('click',function(){var k=SCALES.indexOf(P.scale);if(k<SCALES.length-1){P.scale=SCALES[k+1];save();applyScale();}});
document.getElementById('z-dn').addEventListener('click',function(){var k=SCALES.indexOf(P.scale);if(k>0){P.scale=SCALES[k-1];save();applyScale();}});
document.addEventListener('keydown',function(e){
  if(P.i>=P.order.length||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase(),idx=-1;
  if(k>='1'&&k<='4')idx=parseInt(k,10)-1;
  else if(k==='a'||k==='b'||k==='c'||k==='d')idx=k.charCodeAt(0)-97;
  if(idx>-1){selectOption(idx);e.preventDefault();return;}
  if(k==='enter'&&e.target.tagName!=='BUTTON'){var mb=document.getElementById('main-btn');if(mb&&!mb.disabled){mb.click();e.preventDefault();}}
});

render();
})();
</script>
